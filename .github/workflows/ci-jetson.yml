name: Jetson Core CI

on:
  push:
    paths:
      - "jetson-core/**"
      - ".github/workflows/ci-jetson.yml"
  pull_request:
    paths:
      - "jetson-core/**"
      - ".github/workflows/ci-jetson.yml"

jobs:
  jetson-core:
    # Run on Windows to match developer environments
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format via npm
        run: npm install -g clang-format

      - name: Clang-format style check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path jetson-core/src -Recurse -Include *.cpp,*.cc,*.c,*.h,*.hpp -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
            Write-Host "No C/C++ sources under jetson-core/src; skipping clang-format check."
            exit 0
          }
          Write-Host "Running clang-format check on $($files.Count) files..."
          $failed = $false
          foreach ($file in $files) {
            $result = clang-format --dry-run --Werror $file.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: $($file.FullName)"
              Write-Host $result
              $failed = $true
            }
          }
          if ($failed) {
            Write-Host "`nClang-format check failed. Run 'clang-format -i' on the failing files."
            exit 1
          }
          Write-Host "All files passed clang-format check."

      # NOTE: CMake build, clang-tidy, cppcheck, gcovr, and lizard are skipped
      # on Windows CI. The actual Jetson build happens on the Jetson device.
      # This CI only validates code style to catch formatting issues early.