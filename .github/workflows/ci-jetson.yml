name: Jetson Core CI

on:
  push:
    paths:
      - "jetson-core/**"
      - ".github/workflows/ci-jetson.yml"
  pull_request:
    paths:
      - "jetson-core/**"
      - ".github/workflows/ci-jetson.yml"

jobs:
  format-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need write access to push auto-formatted changes back
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-14 100

      - name: Auto-format C++ files
        run: |
          FILES=$(find jetson-core/src -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "Formatting $(echo "$FILES" | wc -l) files..."
            echo "$FILES" | xargs clang-format -i
          else
            echo "No C/C++ sources found; skipping format."
          fi

      - name: Commit formatted files (if any changes)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: auto-format C++ files [skip ci]"
            git push
            echo "Formatted files committed."
          fi

  # NOTE: Actual build/test happens on Jetson hardware, not in CI.
  # This workflow only ensures consistent code style.