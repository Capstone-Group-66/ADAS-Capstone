name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        working-directory: mobile-app/MobileApplication
        run: chmod +x gradlew

      - name: Auto-format Kotlin files
        working-directory: mobile-app/MobileApplication
        run: ./gradlew ktlintFormat || true

      - name: Commit formatted files (if any changes)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: auto-format Kotlin files [skip ci]"
            git push
            echo "Formatted files committed."
          fi

      - name: Build Debug
        working-directory: mobile-app/MobileApplication
        run: ./gradlew assembleDebug

      - name: Run unit tests
        working-directory: mobile-app/MobileApplication
        run: ./gradlew test

      - name: Android Lint
        working-directory: mobile-app/MobileApplication
        run: ./gradlew lint

      - name: Generate JaCoCo report
        working-directory: mobile-app/MobileApplication
        run: ./gradlew jacocoTestReport