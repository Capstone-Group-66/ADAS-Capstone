schema_version: "1.0"
vehicle: Civic_2012

# ══════════════════════════════════════════════════════════════════════════════
#                         TIME SYNCHRONIZATION (FR6)
# ══════════════════════════════════════════════════════════════════════════════
time:
  fusion_hz: 20
  max_skew_ms: 5
  buffer_ms: 150
  late_drop_ms: 100
  warmup_ticks: 40

# ══════════════════════════════════════════════════════════════════════════════
#                         NETWORK INGEST (Pi4 Rear Sector)
# ══════════════════════════════════════════════════════════════════════════════
network:
  port: 9000
  latency_correction_ms: 25    # Configurable offset for timestamp correction
  reconnect_timeout_ms: 5000

# ══════════════════════════════════════════════════════════════════════════════
#                         CAMERA SETTINGS (Direct USB)
# ══════════════════════════════════════════════════════════════════════════════
cameras:
  width: 960
  height: 540
  target_fps: 20
  use_mjpeg: true

# ══════════════════════════════════════════════════════════════════════════════
#                         FRONT RADAR (OPS243-A)
# ══════════════════════════════════════════════════════════════════════════════
front_radar:
  port: "/dev/ttyACM0"
  baud_rate: 921600
  poll_timeout_ms: 50
  output_mode: "split_range"
  speed_ttl_ms: 900
  speed_mag_threshold: 10
  range_mag_threshold: 20
  profile: "combined_hs"

# Stage E front fusion / FCW v3 tuning
stage_e_fusion:
  ttc_aggressive_s: 3.0
  camera_hold_ms: 400
  radar_hold_ms: 1100
  track_cleanup_ms: 1600
  predicted_camera_threshold_ms: 80
  gps_correction_gain: 0.8
  normal_angle_gate_deg: 12.5
  aggressive_angle_gate_deg: 18.0
  aggressive_range_scale: 1.5
  provisional_min_hits: 3
  provisional_track_hold_ms: 1200
  provisional_seed_min_closing_mps: 0.5
  provisional_seed_max_ttc_s: 6.0
  provisional_seed_max_range_m: 60.0
  provisional_alpha: 0.65
  provisional_beta: 0.18
  promotion_range_gate_m: 6.0
  promotion_aggressive_range_gate_m: 8.0
  promotion_max_abs_theta_deg: 15.0
  promotion_min_hits: 3
  derived_speed_min_hits: 3
  derived_speed_min_dt_ms: 20
  derived_speed_max_dt_ms: 250
  derived_speed_hold_ms: 200
  derived_speed_max_abs_mps: 25.0
  ekf_r_radar_vz_derived: 1.8
  ekf_q_z: 1.0
  ekf_q_vz: 1.2
  ekf_q_theta: 0.04
  ekf_q_theta_dot: 0.06
  ekf_r_radar_z: 0.35
  ekf_r_radar_vz: 0.55
  ekf_r_cam_theta: 0.018
  ekf_r_cam_z_weak: 30.0

# ══════════════════════════════════════════════════════════════════════════════
#                         IMU (BNO085) - SCAFFOLD
# ══════════════════════════════════════════════════════════════════════════════
imu:
  bus: "/dev/i2c-1"
  rate_hz: 100
  use_uart: false

# ══════════════════════════════════════════════════════════════════════════════
#                         MOUNT EXTRINSICS (Ego Frame)
# ══════════════════════════════════════════════════════════════════════════════
# Position [x, y, z] in meters relative to vehicle center
# Orientation [roll, pitch, yaw] in degrees
mounts:
  FrontCam:
    xyz_m: [0.85, 0.00, 1.35]
    rpy_deg: [0, -3.0, 0]
  FrontRadar:
    xyz_m: [0.90, 0.00, 0.50]
    rpy_deg: [0, 0.0, 0]
  RearCornerRadarL:
    xyz_m: [-0.90, 0.65, 0.50]
    rpy_deg: [0, 0.0, 12]
  RearCornerRadarR:
    xyz_m: [-0.90, -0.65, 0.50]
    rpy_deg: [0, 0.0, -12]
  IMU:
    xyz_m: [0.00, 0.00, 0.55]
    rpy_deg: [0, 0.0, 0]
