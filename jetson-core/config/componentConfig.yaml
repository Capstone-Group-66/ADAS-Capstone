schema_version: "1.0"
vehicle: Civic_2012

# ══════════════════════════════════════════════════════════════════════════════
#                         TIME SYNCHRONIZATION (FR6)
# ══════════════════════════════════════════════════════════════════════════════
time:
  fusion_hz: 20
  max_skew_ms: 5
  buffer_ms: 150
  late_drop_ms: 100
  warmup_ticks: 40

# ══════════════════════════════════════════════════════════════════════════════
#                         NETWORK INGEST (Pi4 Rear Sector)
# ══════════════════════════════════════════════════════════════════════════════
network:
  port: 9000
  latency_correction_ms: 25    # Configurable offset for timestamp correction
  reconnect_timeout_ms: 5000

# ══════════════════════════════════════════════════════════════════════════════
#                         CAMERA SETTINGS (Direct USB)
# ══════════════════════════════════════════════════════════════════════════════
cameras:
  width: 960
  height: 540
  side_width: 424
  side_height: 240
  target_fps: 20
  use_mjpeg: true

# ══════════════════════════════════════════════════════════════════════════════
#                         FRONT RADAR (OPS243-A)
# ══════════════════════════════════════════════════════════════════════════════
front_radar:
  port: "/dev/ttyACM0"
  baud_rate: 921600
  poll_timeout_ms: 50
  speed_ttl_ms: 900
  speed_mag_threshold: 10
  range_mag_threshold: 20
  profile: "combined_hs"

# Stage E front fusion / FCW v3 tuning
stage_e_fusion:
  ttc_aggressive_s: 3.0
  camera_hold_ms: 400
  normal_angle_gate_deg: 12.5
  aggressive_angle_gate_deg: 18.0
  aggressive_range_scale: 1.5
  ekf_q_z: 1.0
  ekf_q_vz: 1.2
  ekf_q_theta: 0.04
  ekf_q_theta_dot: 0.06
  ekf_r_radar_z: 0.35
  ekf_r_radar_vz: 0.55
  ekf_r_cam_theta: 0.018
  ekf_r_cam_z_weak: 30.0

# ══════════════════════════════════════════════════════════════════════════════
#                         IMU (BNO085) - SCAFFOLD
# ══════════════════════════════════════════════════════════════════════════════
imu:
  bus: "/dev/i2c-1"
  rate_hz: 100
  use_uart: false

# ══════════════════════════════════════════════════════════════════════════════
#                         MOUNT EXTRINSICS (Ego Frame)
# ══════════════════════════════════════════════════════════════════════════════
# Position [x, y, z] in meters relative to vehicle center
# Orientation [roll, pitch, yaw] in degrees
mounts:
  FrontCam:
    xyz_m: [0.85, 0.00, 1.35]
    rpy_deg: [0, -3.0, 0]
  SideCamL:
    xyz_m: [0.30, 0.80, 1.10]
    rpy_deg: [0, 0.0, 5]
  SideCamR:
    xyz_m: [0.30, -0.80, 1.10]
    rpy_deg: [0, 0.0, -5]
  RearCam:
    xyz_m: [-1.10, 0.00, 1.10]
    rpy_deg: [0, 3.0, 0]
  FrontRadar:
    xyz_m: [0.90, 0.00, 0.50]
    rpy_deg: [0, 0.0, 0]
  RearCornerRadarL:
    xyz_m: [-0.90, 0.65, 0.50]
    rpy_deg: [0, 0.0, 12]
  RearCornerRadarR:
    xyz_m: [-0.90, -0.65, 0.50]
    rpy_deg: [0, 0.0, -12]
  IMU:
    xyz_m: [0.00, 0.00, 0.55]
    rpy_deg: [0, 0.0, 0]
